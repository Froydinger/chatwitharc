project_id = "jpqtoixhjnfdubvqshwk"

[functions]
  [functions.cloud-run]
    # Handler verifies the current user with auth.getUser on every request.
    # Deployment alone does not enable it: CLOUD_RUNS_ENABLED must be true.
    verify_jwt = false
  [functions.cloud-worker]
    # Scheduler uses a dedicated secret, not a browser JWT. The handler checks
    # CLOUD_WORKER_SECRET and stays disabled unless CLOUD_WORKER_ENABLED=true.
    verify_jwt = false
  [functions.cloud-scheduled-worker]
    # Dedicated scheduler bearer secret checked inside the handler. Default-off
    # cutover gates in cloudScheduledRuntime.ts; no cron is installed here.
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  [functions.send-transactional-email]
    # The function performs its own user/admin/service authentication. Keeping
    # the gateway check on rejects Supabase's newer sb_secret service key before
    # internal jobs can reach that authentication layer.
    verify_jwt = false
  [functions.preview-transactional-email]
    verify_jwt = false
  [functions.handle-email-unsubscribe]
    verify_jwt = false
  [functions.handle-email-suppression]
    verify_jwt = false
  [functions.run-scheduled-tasks]
    verify_jwt = false
  [functions.receive-email]
    verify_jwt = false
  [functions.upload-avatar]
    verify_jwt = true
  [functions.delete-r2-image]
    verify_jwt = true
  [functions.system-health]
    # Public status and privacy-safe aggregate pageview endpoint.
    # The function never trusts a caller identity and uses service_role only
    # for its narrow aggregate reads/write.
    verify_jwt = false
