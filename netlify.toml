[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/status"
  to = "/index.html"
  status = 200
  force = true

# BEGIN generated blog routes (scripts/prerender.mjs) — do not edit by hand

[[headers]]
  for = "/_prerender/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/blog"
  to = "/_prerender/blog.html"
  status = 200

