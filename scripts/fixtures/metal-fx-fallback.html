<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arc decorative MetalFx QA</title>
    <style>
      :root { --foreground: 0 0% 94%; color-scheme: dark; font: 16px system-ui, sans-serif; background: #111; color: #eee; }
      :root.light { --foreground: 0 0% 10%; color-scheme: light; background: #eee; color: #111; }
      body { max-width: 620px; margin: 32px auto; padding: 0 20px; }
      a { color: inherit; } nav, .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
      button, input { font: inherit; padding: 10px 16px; border-radius: 9999px; border: 1px solid #777; color: inherit; background: transparent; }
      .surface { position: relative; border-radius: 24px; padding: 24px; border: 1px solid #555; margin: 24px 0; }
      .surface > .controls { position: relative; z-index: 1; }
      .overlay { position: absolute !important; inset: 0; width: 100%; height: 100%; border-radius: inherit !important; background: transparent !important; pointer-events: none !important; }
      .overlay > .metal-fx-content, .host { display: block !important; width: 100%; height: 100%; pointer-events: none !important; border-radius: inherit; }
      output, pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <h1>Decorative MetalFx QA</h1>
    <p>Offline fixture only. Run Vite, then open this page in Safari. No app auth, providers, microphone, or account state is imported.</p>
    <nav id="cases"></nav>
    <div class="controls">
      <button id="theme" type="button">Toggle light/dark</button>
      <button id="mount" type="button">Close / reopen surface</button>
    </div>
    <div id="root"></div>
    <pre id="status" role="status">Loading…</pre>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      const modes = ['native', 'unsupported', 'offscreen-unsupported', 'dom-unsupported', 'lost-probe', 'init-failure', 'child-error'];
      const mode = new URLSearchParams(location.search).get('mode') || 'native';
      for (const name of modes) {
        const link = document.createElement('a');
        link.href = `?mode=${name}`;
        link.textContent = name;
        document.querySelector('#cases').append(link);
      }
      const errors = [];
      addEventListener('error', event => errors.push(event.message));
      let contextCalls = 0, probeReleases = 0;
      const domGetContext = HTMLCanvasElement.prototype.getContext;
      const fakeProbe = { isContextLost: () => mode === 'lost-probe', getExtension: () => ({ loseContext() { probeReleases++; } }) };
      const intercept = function (original, type, ...args) {
        if (type !== 'webgl' && type !== 'experimental-webgl') return original?.call(this, type, ...args) ?? null;
        contextCalls++;
        if (mode === 'lost-probe') return fakeProbe;
        if (mode === 'init-failure') return contextCalls === 1 ? fakeProbe : null;
        return null;
      };
      // Page-local mocks only. No Safari/GPU/security preferences are changed.
      if (['unsupported', 'dom-unsupported', 'lost-probe', 'init-failure'].includes(mode)) {
        HTMLCanvasElement.prototype.getContext = function (type, ...args) { return intercept.call(this, domGetContext, type, ...args); };
      }
      if (mode === 'dom-unsupported') {
        Object.defineProperty(globalThis, 'OffscreenCanvas', { configurable: true, value: undefined });
      } else if (['unsupported', 'offscreen-unsupported', 'lost-probe', 'init-failure'].includes(mode)) {
        Object.defineProperty(globalThis, 'OffscreenCanvas', { configurable: true, value: class {
          constructor(width, height) { this.width = width; this.height = height; }
          getContext(type, ...args) { return intercept.call(this, null, type, ...args); }
        } });
      }

      const { SafeMetalFx } = await import('/src/components/ui/safe-metal-fx.tsx');
      const { getMetalFxSupport } = await import('/src/lib/metalFxSupport.ts');
      const h = React.createElement;
      const root = createRoot(document.querySelector('#root'));
      let open = true, theme = 'dark', clicks = 0;
      function ChildError() { throw new Error('Fixture application error must reach the outer boundary'); }
      class ApplicationBoundary extends React.Component {
        state = { error: null };
        static getDerivedStateFromError(error) { return { error }; }
        render() { return this.state.error ? h('output', { id: 'app-error' }, this.state.error.message) : this.props.children; }
      }
      const read = () => ({
        mode, open, theme, clicks, support: getMetalFxSupport(), contextCalls, probeReleases,
        fallbacks: document.querySelectorAll('[data-metal-fx-fallback]').length,
        liveEffects: document.querySelectorAll('.metal-fx-root').length,
        canvases: document.querySelectorAll('#root canvas').length,
        outerError: document.querySelector('#app-error')?.textContent || null,
        errors,
      });
      const report = () => { document.querySelector('#status').textContent = JSON.stringify(read(), null, 2); };
      function render() {
        root.render(h(ApplicationBoundary, null, open && h('section', { className: 'surface' },
          h(SafeMetalFx, { preset: 'silver', theme, strength: 0.28, normalizeHostStyles: false, className: 'overlay' },
            mode === 'child-error' ? h(ChildError) : h('span', { className: 'host' })),
          h('p', null, 'These controls must stay visible and usable in every graphics mode.'),
          h('div', { className: 'controls' },
            h('input', { 'aria-label': 'Local draft', placeholder: 'Type a local draft' }),
            h('button', { type: 'button', onClick() { clicks++; report(); } }, 'Test click'),
            h('button', { type: 'button', onClick() { open = false; render(); } }, 'Close')))));
        setTimeout(report, 300);
      }
      document.querySelector('#theme').onclick = () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        document.documentElement.className = theme;
        render();
      };
      document.querySelector('#mount').onclick = () => { open = !open; render(); };
      globalThis.__metalFxQA = { read, close() { open = false; render(); }, reopen() { open = true; render(); } };
      render();
    </script>
  </body>
</html>
