<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Tap Dash</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg2: #111a33;
        --accent: #7dd3fc;
        --accent2: #c084fc;
        --text: #e6edf7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: ui-rounded, "Avenir Next", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 15% 10%, #1a2c59 0%, var(--bg) 45%, #05070f 100%);
        height: 100vh;
        overflow: hidden;
      }

      .hud {
        position: fixed;
        inset: 12px 12px auto 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        z-index: 3;
      }

      .pill {
        background: rgba(9, 15, 30, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 6px 12px;
        backdrop-filter: blur(8px);
        font-size: 14px;
      }

      .btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 7px 12px;
        color: #051022;
        font-weight: 700;
        background: linear-gradient(140deg, var(--accent), var(--accent2));
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(4, 6, 13, 0.45);
        z-index: 2;
      }

      .panel {
        width: min(94vw, 420px);
        background: linear-gradient(180deg, rgba(13, 23, 49, 0.96), rgba(11, 16, 33, 0.95));
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .panel p {
        margin: 0 0 10px;
        line-height: 1.35;
        color: #dbe6ff;
      }

      .panel .big {
        font-size: 42px;
        font-weight: 700;
        color: var(--accent);
        margin: 10px 0;
      }

      .panel .row {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

      .panel button {
        flex: 1;
        border: 0;
        border-radius: 999px;
        padding: 10px 12px;
        font-weight: 700;
      }

      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: #c1d4ff;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="pill" id="score">Score: 0</div>
      <div class="pill" id="best">Best: 0</div>
      <div class="pill" id="speed">Speed: 1.0x</div>
      <button class="btn" id="pauseBtn">Pause</button>
    </div>

    <canvas id="game"></canvas>

    <div class="overlay" id="startOverlay">
      <div class="panel">
        <h1>Tiny Tap Dash</h1>
        <p>
          Tap/click to jump between lanes, grab glowing stars, and dodge black meteors.
        </p>
        <div class="big" id="ready">Tap to start</div>
        <div class="row">
          <button id="startBtn">Start</button>
        </div>
        <div class="hint">Tip: it speeds up over time. One miss ends your run.</div>
      </div>
    </div>

    <div class="overlay" id="gameOverOverlay" style="display:none">
      <div class="panel">
        <h1>Game Over</h1>
        <p>Your score and reaction streak are on the board.</p>
        <div class="big" id="finalScore">0</div>
        <div class="row">
          <button id="retryBtn">Play again</button>
          <button id="closeBtn" style="background: #1f2937; color: #e5e7eb;">Close</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const speedEl = document.getElementById('speed');
      const pauseBtn = document.getElementById('pauseBtn');
      const startOverlay = document.getElementById('startOverlay');
      const gameOverOverlay = document.getElementById('gameOverOverlay');
      const startBtn = document.getElementById('startBtn');
      const retryBtn = document.getElementById('retryBtn');
      const closeBtn = document.getElementById('closeBtn');
      const finalScore = document.getElementById('finalScore');

      const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const lanes = 3;
      const player = {
        lane: 1,
        y: 0,
        w: 58,
        h: 18,
        vy: 0,
        jumpY: 0,
        jumpTarget: 0,
        jump: false,
      };

      const stars = [];
      const meteors = [];
      let score = 0;
      let best = Number(localStorage.getItem('tinyTapBest') || 0);
      let speed = 1;
      let running = false;
      let paused = false;
      let last = 0;
      let spawnTimer = 0;

      const world = {
        width: 0,
        height: 0,
        laneW: 0,
        groundY: 0,
      };

      const state = {
        laneOffsets: [0, 0, 0],
      };

      function resize() {
        const r = canvas.getBoundingClientRect();
        canvas.width = Math.floor(r.width * DPR);
        canvas.height = Math.floor(r.height * DPR);
        canvas.style.width = `${r.width}px`;
        canvas.style.height = `${r.height}px`;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        world.width = r.width;
        world.height = r.height;
        world.laneW = world.width / lanes;
        world.groundY = world.height - 90;
        player.y = world.groundY - player.h;
        player.x = laneX(player.lane) - player.w / 2;
      }

      function laneX(lane) {
        return world.laneW * (lane + 0.5);
      }

      function reset() {
        stars.length = 0;
        meteors.length = 0;
        score = 0;
        speed = 1;
        player.lane = 1;
        player.jump = false;
        player.jumpY = 0;
        player.jumpTarget = 0;
        player.vy = 0;
        spawnTimer = 0;
        state.laneOffsets = [0, 0, 0];
        player.y = world.groundY - player.h;
      }

      function randomLaneObject(type) {
        const lane = Math.floor(Math.random() * lanes);
        const baseX = laneX(lane);
        return {
          lane,
          x: baseX - 12,
          y: -20,
          w: 24,
          h: 24,
          speed: 120 + Math.random() * 80,
          kind: type,
          glow: type === 'star' ? 0.8 + Math.random() * 0.8 : 1,
          spin: Math.random() * Math.PI,
          pulse: Math.random() * Math.PI * 2,
          wobble: Math.random() * 0.6 + 0.2,
        };
      }

      function spawn(delta) {
        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          const chance = Math.random();
          const type = chance > 0.72 ? 'meteor' : 'star';
          const obj = randomLaneObject(type);
          (type === 'meteor' ? meteors : stars).push(obj);
          spawnTimer = Math.max(0.25, 0.95 - speed * 0.08) + Math.random() * 0.4;
        }
      }

      function moveObjects(arr, delta, color) {
        for (let i = arr.length - 1; i >= 0; i--) {
          const o = arr[i];
          o.y += (o.speed * speed) * delta;
          o.x += Math.sin((o.wobble * o.y) * 0.02) * 0.35;
          o.pulse += delta * 4;
          if (o.y - 40 > world.height) {
            arr.splice(i, 1);
            if (color === 'star') score = Math.max(score - 2, 0);
          }
        }
      }

      function collide(a, b) {
        return a.x < b.x + b.w &&
               a.x + a.w > b.x &&
               a.y < b.y + b.h &&
               a.y + a.h > b.y;
      }

      function drawLaneLines() {
        for (let i = 1; i < lanes; i++) {
          const x = world.laneW * i;
          ctx.strokeStyle = 'rgba(255,255,255,0.14)';
          ctx.lineWidth = 2;
          ctx.setLineDash([14, 12]);
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, world.height);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      function drawPlayer() {
        player.x = laneX(player.lane) - player.w / 2 + state.laneOffsets[player.lane];
        const bounce = player.jump ? Math.sin(Date.now() * 0.03) * 4 : 0;
        const y = player.y - player.jumpY + bounce;

        const grad = ctx.createLinearGradient(player.x, y, player.x + player.w, y + player.h);
        grad.addColorStop(0, '#67e8f9');
        grad.addColorStop(1, '#f0abfc');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(player.x, y, player.w, player.h, 9);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(player.x + 8, y + 4, 12, 10);
        ctx.fillRect(player.x + 38, y + 4, 12, 10);
        if (player.jump) {
          ctx.fillStyle = 'rgba(253,224,71,0.95)';
          ctx.beginPath();
          ctx.arc(player.x + player.w / 2, y - 8, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawStars() {
        for (const s of stars) {
          const t = (Math.sin(s.pulse) + 1) / 2;
          const sx = s.x;
          const sy = s.y;
          ctx.save();
          ctx.translate(sx, sy);
          const a = 0.5 + t * 0.5;
          ctx.globalAlpha = a;
          const g = ctx.createRadialGradient(12, 12, 2, 12, 12, 13);
          g.addColorStop(0, '#fef08a');
          g.addColorStop(0.6, '#f59e0b');
          g.addColorStop(1, 'rgba(245,158,11,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(12, 12, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(sx + 12, sy + 12, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawMeteors() {
        for (const m of meteors) {
          const y = m.y;
          const x = m.x;
          const c = ctx.createLinearGradient(x, y, x + m.w, y + m.h);
          c.addColorStop(0, '#0f172a');
          c.addColorStop(0.5, '#7f1d1d');
          c.addColorStop(1, '#f97316');
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.roundRect(x, y, m.w, m.h, 6);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255,255,255,0.22)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x - 10, y + m.h);
          ctx.lineTo(x - 30, y + m.h + 20);
          ctx.stroke();
        }
      }

      function chooseLane(nextLane) {
        nextLane = Math.min(Math.max(0, nextLane), lanes - 1);
        if (nextLane === player.lane) {
          if (!player.jump) player.jump = true;
          return;
        }
        player.lane = nextLane;
        player.jump = true;
        player.jumpY = 0;
        player.jumpTarget = 28;
        player.vy = 420;
      }

      function updateJump(delta) {
        if (!player.jump) return;
        player.jumpY += player.vy * delta;
        player.vy -= 680 * delta;
        if (player.jumpY >= player.jumpTarget) {
          player.jumpY = 0;
          player.jump = false;
          player.vy = 0;
        }
      }

      function checkCollisions() {
        const playerHitbox = {
          x: player.x,
          y: player.y - player.jumpY,
          w: player.w,
          h: player.h,
        };

        for (let i = stars.length - 1; i >= 0; i--) {
          const s = stars[i];
          const obj = { x: s.x, y: s.y, w: s.w, h: s.h };
          if (collide(playerHitbox, obj)) {
            stars.splice(i, 1);
            score += 10;
            speed = Math.min(2.5, speed + 0.05);
            break;
          }
        }

        for (const m of meteors) {
          if (collide(playerHitbox, { x: m.x, y: m.y, w: m.w, h: m.h })) {
            endGame();
            return;
          }
        }
      }

      function endGame() {
        running = false;
        best = Math.max(best, score);
        localStorage.setItem('tinyTapBest', String(best));
        finalScore.textContent = `Score ${score}`;
        gameOverOverlay.style.display = 'grid';
      }

      function updateHud() {
        scoreEl.textContent = `Score: ${score}`;
        bestEl.textContent = `Best: ${best}`;
        speedEl.textContent = `Speed: ${speed.toFixed(1)}x`;
      }

      function animate(timestamp) {
        if (!running || paused) {
          last = timestamp;
          requestAnimationFrame(animate);
          return;
        }

        const dt = Math.min(0.05, (timestamp - last) / 1000);
        last = timestamp;

        const ctxClear = `rgba(4, 8, 18, 0.6)`;
        ctx.fillStyle = ctxClear;
        ctx.fillRect(0, 0, world.width, world.height);

        spawn(dt);
        moveObjects(stars, dt);
        moveObjects(meteors, dt);

        player.hitLaneJitter = Math.sin(timestamp * 0.03) * 0.5;
        state.laneOffsets[player.lane] = player.hitLaneJitter;

        drawLaneLines();
        drawStars();
        drawMeteors();
        updateJump(dt);
        drawPlayer();

        checkCollisions();
        score += dt * 2;
        updateHud();

        requestAnimationFrame(animate);
      }

      function startGame() {
        reset();
        updateHud();
        bestEl.textContent = `Best: ${best}`;
        gameOverOverlay.style.display = 'none';
        startOverlay.style.display = 'none';
        running = true;
        paused = false;
        pauseBtn.textContent = 'Pause';
        last = performance.now();
        requestAnimationFrame(animate);
      }

      function setPointerHandlers() {
        const pointerHandler = (e) => {
          if (!running || paused) return;
          const x = e.clientX || (e.touches && e.touches[0]?.clientX);
          if (!x) return;
          const targetLane = Math.floor((x / world.width) * lanes);
          chooseLane(targetLane);
        };

        canvas.addEventListener('pointerdown', (e) => {
          if (!running || paused) return;
          pointerHandler(e);
        });

        canvas.addEventListener('pointermove', (e) => {
          if (!running || paused || (e.buttons & 1) === 0) return;
          pointerHandler(e);
        });
      }

      function setKeyboardHandlers() {
        window.addEventListener('keydown', (e) => {
          if (!running || paused) return;
          if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
            chooseLane(player.lane - 1);
          } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
            chooseLane(player.lane + 1);
          } else if (e.key === ' ' || e.key === 'ArrowUp') {
            if (!player.jump) player.jump = true;
          }
        });
      }

      window.addEventListener('resize', resize);
      resize();
      bestEl.textContent = `Best: ${best}`;
      setPointerHandlers();
      setKeyboardHandlers();

      startBtn.addEventListener('click', startGame);
      retryBtn.addEventListener('click', startGame);
      pauseBtn.addEventListener('click', () => {
        if (!running) return;
        paused = !paused;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      });
      closeBtn.addEventListener('click', () => {
        gameOverOverlay.style.display = 'none';
        startOverlay.style.display = 'grid';
        const ready = document.getElementById('ready');
        ready.textContent = 'Tap to start';
      });
      startOverlay.addEventListener('click', (e) => {
        if (e.target === startOverlay) startGame();
      });
      gameOverOverlay.addEventListener('click', (e) => {
        if (e.target === gameOverOverlay) startGame();
      });
    </script>
  </body>
</html>
